[package]
name = "hooking"
version = "0.6.1"
edition = "2024"
license = "MIT"
description = "hooking libs in rust"
readme = "../README.md"
repository = "https://github.com/pigeonhands/hooking-rs"

[features]
default = ["macros"]
macros = [ "hooking_macros" ]

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = [
    "std",
    "decoder",
    "encoder",
    "block_encoder",
    "code_asm",
    "instr_info",
] }
thiserror = "2.0.18"
hooking_macros = { version = "0.6", path = "../hooking_macros/", optional = true}
ctor = "1.0.7"

[dev-dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }

[target.'cfg(windows)'.profile.dev]
split-debuginfo = "packed" # Or "off" to keep it all in the binary

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
